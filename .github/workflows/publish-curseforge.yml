name: Publish addon to CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to publish (leave empty for the latest release)
        required: false
        type: string
      game_versions:
        description: Comma-separated Minecraft Bedrock versions
        required: true
        default: "26.30"
        type: string
      release_type:
        description: CurseForge release channel
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha

permissions:
  contents: read

concurrency:
  group: curseforge-${{ github.event.release.tag_name || inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Upload release asset
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
      DEFAULT_GAME_VERSIONS: ${{ vars.CURSEFORGE_GAME_VERSIONS }}
      EVENT_TAG: ${{ github.event.release.tag_name }}
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_GAME_VERSIONS: ${{ inputs.game_versions }}
      INPUT_RELEASE_TYPE: ${{ inputs.release_type }}

    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CURSEFORGE_API_TOKEN}" ]]; then
            echo "::error::The CURSEFORGE_API_TOKEN secret is not configured."
            exit 1
          fi
          if [[ -z "${CURSEFORGE_PROJECT_ID}" ]]; then
            echo "::error::The CURSEFORGE_PROJECT_ID repository variable is not configured."
            exit 1
          fi

      - name: Resolve GitHub release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="${EVENT_TAG:-${INPUT_TAG:-}}"
          if [[ -z "${tag}" ]]; then
            tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq '.tagName')"
          fi

          release_json="${RUNNER_TEMP}/release.json"
          gh release view "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json tagName,name,body,isPrerelease \
            > "${release_json}"

          release_name="$(jq -r '.name // .tagName' "${release_json}")"
          jq -r '.body // ""' "${release_json}" > "${RUNNER_TEMP}/changelog.md"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_type="${INPUT_RELEASE_TYPE}"
            game_versions="${INPUT_GAME_VERSIONS}"
          else
            if [[ "$(jq -r '.isPrerelease' "${release_json}")" == "true" ]]; then
              release_type="beta"
            else
              release_type="release"
            fi
            game_versions="${DEFAULT_GAME_VERSIONS:-26.30}"
          fi

          {
            echo "tag=${tag}"
            echo "release_name=${release_name}"
            echo "release_type=${release_type}"
            echo "game_versions=${game_versions}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download and prepare addon
        id: asset
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          asset_dir="${RUNNER_TEMP}/addon"
          mkdir -p "${asset_dir}"

          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "VCMC-WORLD-REALMS.zip" \
            --dir "${asset_dir}"

          mapfile -d '' zip_files < <(
            find "${asset_dir}" -maxdepth 1 -type f -name 'VCMC-WORLD-REALMS.zip' -print0
          )

          if [[ "${#zip_files[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one ZIP asset; found ${#zip_files[@]}."
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          addon_path="${asset_dir}/VCMC-Addon-${version}.mcaddon"
          cp "${zip_files[0]}" "${addon_path}"
          echo "path=${addon_path}" >> "${GITHUB_OUTPUT}"

      - name: Build CurseForge metadata
        shell: bash
        env:
          GAME_VERSIONS: ${{ steps.release.outputs.game_versions }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
          RELEASE_TYPE: ${{ steps.release.outputs.release_type }}
        run: |
          set -euo pipefail

          game_versions_json="$(
            printf '%s' "${GAME_VERSIONS}" \
              | tr ',' '\n' \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
              | sed '/^$/d' \
              | jq -R . \
              | jq -s .
          )"

          jq -n \
            --rawfile changelog "${RUNNER_TEMP}/changelog.md" \
            --arg display_name "${RELEASE_NAME}" \
            --arg release_type "${RELEASE_TYPE}" \
            --argjson game_versions "${game_versions_json}" \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $display_name,
              gameVersionNames: $game_versions,
              releaseType: $release_type,
              isMarkedForManualRelease: false
            }' > "${RUNNER_TEMP}/curseforge-metadata.json"

      - name: Upload to CurseForge
        shell: bash
        env:
          ADDON_PATH: ${{ steps.asset.outputs.path }}
        run: |
          set -euo pipefail

          response="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url "https://minecraft.curseforge.com/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file" \
              --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
              --form "metadata=<${RUNNER_TEMP}/curseforge-metadata.json;type=application/json" \
              --form "file=@${ADDON_PATH}"
          )"

          file_id="$(jq -er '.id' <<< "${response}")"
          echo "CurseForge accepted file ID ${file_id}."
